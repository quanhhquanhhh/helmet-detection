<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed test</title>
<style>body{font:16px -apple-system,system-ui,sans-serif;background:#111;color:#eee;margin:16px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #444;padding:6px;text-align:right}th:first-child,td:first-child{text-align:left}#st{color:#9cf}</style>
</head><body><h2>Helmet app — GPU speed test</h2><div id="st">Running… keep this page open (about 1–2 minutes).</div><table id="t"></table><pre id="info"></pre>
<script>
const q = new URLSearchParams(location.search);
const VERS = ["1.20.1", "1.23.0"];
const v = q.get("v") || VERS[0];
const prev = JSON.parse(q.get("r") || "{}");
const JOBS = [["dyn32", "model (current, fp32)", [480, 640, 960, 1280]], ["dyn16", "model fp16", [480, 640, 960, 1280]],
              ["st640_16", "fp16 fixed 640", [640]], ["st960_16", "fp16 fixed 960", [960]]];
function table(r) {
  const rows = [];
  for (const [m, name, sizes] of JOBS) for (const S of sizes) rows.push(`<tr><td>${name} @${S}</td>` + VERS.map((x) => `<td>${r[`${x}|${m}|${S}`] ?? "…"}</td>`).join("") + "</tr>");
  document.getElementById("t").innerHTML = `<tr><th>ms per run (lower = faster)</th>${VERS.map((x) => `<th>ORT ${x}</th>`).join("")}</tr>` + rows.join("");
}
async function load(m) {
  if (m !== "dyn32") return `${m}.onnx`;
  const parts = [];
  for (let i = 1; i <= 9; i++) { const r = await fetch(`model_part${i}.bin`); if (!r.ok) break; parts.push(new Uint8Array(await r.arrayBuffer())); }
  const b = new Uint8Array(parts.reduce((n, x) => n + x.length, 0)); parts.reduce((o, x) => (b.set(x, o), o + x.length), 0); return b;
}
async function time(sess, S, n = 10) {
  const x = new ort.Tensor("float32", new Float32Array(3 * S * S).fill(0.5), [1, 3, S, S]);
  for (let i = 0; i < 3; i++) await sess.run({ [sess.inputNames[0]]: x });
  const t = []; for (let i = 0; i < n; i++) { const t0 = performance.now(); await sess.run({ [sess.inputNames[0]]: x }); t.push(performance.now() - t0); }
  return +t.sort((a, b) => a - b)[n >> 1].toFixed(0);
}
(async () => {
  table(prev);
  let f16 = "?"; try { const a = await navigator.gpu.requestAdapter(); f16 = a && a.features.has("shader-f16"); } catch (e) { f16 = "no WebGPU"; }
  document.getElementById("info").textContent = `shader-f16: ${f16}\n${navigator.userAgent}`;
  await new Promise((ok) => { const s = document.createElement("script"); s.src = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${v}/dist/ort.webgpu.min.js`; s.onload = ok; document.head.appendChild(s); });
  const r = { ...prev };
  for (const [m, , sizes] of JOBS) {
    try {
      const sess = await ort.InferenceSession.create(await load(m), { executionProviders: ["webgpu"], graphOptimizationLevel: "all" });
      for (const S of sizes) { r[`${v}|${m}|${S}`] = await time(sess, S); table(r); }
      await sess.release();
    } catch (e) { for (const S of sizes) r[`${v}|${m}|${S}`] = "error"; table(r); console.error(e); }
  }
  const next = VERS[VERS.indexOf(v) + 1];
  if (next) location.replace(`?v=${next}&r=${encodeURIComponent(JSON.stringify(r))}`);
  else document.getElementById("st").textContent = "Done — please take a screenshot of this table.";
})();
</script></body></html>
